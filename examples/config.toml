# herdr-workthreads configuration
# Location: herdr plugin config-dir workthreads

# Folders scanned one level deep for git repositories. Linked worktrees, hidden folders,
# and folders named "worktrees" or "threads" are skipped.
repo_directories = ["~/code", "~/oss"]

# Extra repositories anywhere on disk.
repos = ["~/infra/terraform-live"]

# Where thread roots are created. Each thread is a folder holding one worktree per
# repository; closing a workspace never deletes anything here.
threads_directory = "~/.herdr/workthreads"

# Prepended to every branch the plugin creates. May contain '/'.
branch_prefix = "rh/"

# Which Herdr workspaces a thread gets: "thread" (one workspace rooted at the thread
# folder), "repos" (one workspace per worktree, nested under its repository in the
# sidebar), or "both".
workspaces = "both"
