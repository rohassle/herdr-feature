id = "workthreads"
name = "Work Threads"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Thread workspaces: Git worktrees from any number of repositories, a board with pull request progress per thread."
platforms = ["macos", "linux"]

# Every action runs the same shim, which reads HERDR_PLUGIN_ACTION_ID and opens the
# single popup entrypoint below with the action name forwarded in the environment.
# Actions run without a TTY; the popup is where fzf and prompts live.

[[actions]]
id = "menu"
title = "Thread: board"
description = "Every thread with its pull request progress. Enter opens; hotkeys run the other commands."
contexts = ["workspace", "pane", "global"]
command = ["sh", "bin/action.sh"]

[[actions]]
id = "new"
title = "Thread: new"
description = "Create a thread: pick repositories, create a worktree in each, open a workspace."
contexts = ["workspace", "pane", "global"]
command = ["sh", "bin/action.sh"]

[[actions]]
id = "add"
title = "Thread: add worktrees"
description = "Add worktrees from more repositories to the current thread."
contexts = ["workspace", "pane", "global"]
command = ["sh", "bin/action.sh"]

[[actions]]
id = "open"
title = "Thread: open"
description = "Focus or reopen the workspace of an existing thread."
contexts = ["workspace", "pane", "global"]
command = ["sh", "bin/action.sh"]

[[actions]]
id = "close"
title = "Thread: close workspaces"
description = "Close a thread's Herdr workspaces. Worktrees, folder and branches are kept."
contexts = ["workspace", "pane", "global"]
command = ["sh", "bin/action.sh"]

[[actions]]
id = "drop"
title = "Thread: drop worktrees"
description = "Remove individual worktrees from the current thread."
contexts = ["workspace", "pane", "global"]
command = ["sh", "bin/action.sh"]

[[actions]]
id = "remove"
title = "Thread: remove"
description = "Remove a thread: all of its worktrees, its folder, and optionally its branches."
contexts = ["workspace", "pane", "global"]
command = ["sh", "bin/action.sh"]

[[actions]]
id = "install-cli"
title = "Thread: install command line"
description = "Symlink the herdr-workthreads command into ~/.local/bin and optionally install the agent skill."
contexts = ["workspace", "pane", "global"]
command = ["sh", "bin/action.sh"]

[[panes]]
id = "ui"
title = "Thread"
placement = "popup"
width = "85%"
height = "70%"
command = ["sh", "bin/bootstrap.sh"]
